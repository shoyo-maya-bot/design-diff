name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: samples can be regenerated and compared
        run: |
          python samples/make_samples.py -o "$RUNNER_TEMP/samples"
          design-diff excel --type api --before samples/before/API0001_会員照会.xlsx --after samples/after/API0001_会員照会.xlsx
          design-diff excel --all
          design-diff spec --excel samples/spec/API定義書.xlsx --oas samples/spec/openapi.yaml -f json > /dev/null
