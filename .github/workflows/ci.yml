name: ci

on:
  pull_request:
  push:
    branches: [main]
  # deps-lock が GITHUB_TOKEN で入れた constraints.txt のコミットでは CI が動かないので、手でも回せるようにする
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: 依存を入れる（constraints.txt があれば版をそろえる）
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: テストとカバレッジ（下限は pyproject.toml の fail_under）
        run: pytest -q --cov --cov-report=term
      - name: samples can be regenerated and compared
        run: |
          python samples/make_samples.py -o "$RUNNER_TEMP/samples"
          design-diff excel --type api --before samples/before/API0001_会員照会.xlsx --after samples/after/API0001_会員照会.xlsx
          design-diff excel --all
          design-diff spec --excel samples/spec/API定義書.xlsx --oas samples/spec/openapi.yaml -f json > /dev/null

  test-windows:
    name: test (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 依存を入れる（constraints.txt があれば版をそろえる）
        shell: bash
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C -e ".[dev]"
      - run: pytest -q
      - name: sample run
        shell: bash
        run: |
          design-diff excel --all --config-dir config
          design-diff spec --excel samples/spec/API定義書.xlsx --oas samples/spec/openapi.yaml -f json > /dev/null

  security:
    name: security (bandit・pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 依存とツールを入れる（ツールの版は固定）
        run: |
          C=""; [ -f constraints.txt ] && C="-c constraints.txt"
          pip install $C -e .
          pip install "bandit==1.8.6" "pip-audit==2.9.0"
      - name: SAST（bandit. 中以上）
        run: bandit -q -r src -ll
      - name: 依存の脆弱性（pip-audit）
        run: pip-audit --skip-editable --progress-spinner off
