# API 設計書（1 API = 1 シート）の新旧比較
#   kind: label  ラベルのセルから offset [行, 列] 離れたセルの値（既定 [0, 1] = 右隣）
#   kind: block  ラベルの下（既定 offset [1, 0]）から空行までの複数行の文章
#   kind: table  見出しの列 header を含む行を見出し行とする表。title を書くとそのラベルの次の行を見出し行にする
#                key の列で行を対応付ける（複数列可）
sheets:
  - name: "API*"
    pair_by: "^(API\\d+)"        # シート名が変わっても API ID で新旧を対応付ける（省略時はシート名で）
    items:
      - {kind: label, name: API ID, label: API ID}
      - {kind: label, name: API 名, label: API 名}
      - {kind: label, name: メソッド, label: メソッド}
      - {kind: label, name: パス, label: パス}
      - {kind: block, name: 処理概要, label: 処理概要}
      - {kind: table, name: 入力項目, title: 入力項目, header: 項目名, key: [項目名]}
      - {kind: table, name: 出力項目, title: 出力項目, header: 項目名, key: [項目名]}
      - {kind: table, name: 応答, title: 応答, header: ステータス, key: [ステータス]}
  - name: "改訂履歴"
    items:
      - {kind: table, name: 改訂履歴, header: 版, key: [版]}
