[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-diff"
version = "0.1.0"
description = "設計書レビュー用の差分レポート（Excel 設計書の新旧差分 / API 定義書と OpenAPI の整合）"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "devtools-common @ git+https://github.com/shoyo-maya-bot/devtools-common.git@bfb7f17c5016966058072f4aba3713ab56d146ba",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
design-diff = "design_diff.cli.main:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
