[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-diff"
version = "0.1.0"
description = "設計書レビュー用の差分レポート（Excel 設計書の新旧差分 / API 定義書と OpenAPI の整合）"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "devtools-common[excel] @ git+https://github.com/shoyo-maya-bot/devtools-common.git@6a263b894409a19a186d2b3b0b41da998174c0d6",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
design-diff = "design_diff.cli.main:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# カバレッジ（CI で測る: pytest --cov）. 下限を下回ると CI が失敗する. 今は 95% 前後
[tool.coverage.run]
source = ["design_diff"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
